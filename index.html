<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Arcana</title>
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-container">
      <img src="/public/img/logo.jpg" alt="Codex Arcana Logo" class="app-logo">
      <div>
        <h1 class="logo-title">CODEX ARCANA</h1>
        <p class="logo-subtitle">Manual del Jugador & Manual de Monstruos (5ª Edición Revisada)</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="auth-container"></div>
      <button class="btn btn-secondary" id="btn-nav-campaigns" onclick="window.campaignUI.openCampaignsList()" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
        Mis Campañas
      </button>
      <button class="btn btn-secondary" id="btn-nav-characters" onclick="window.app.openCharactersList()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Mis Personajes (<span id="saved-count">0</span>)
      </button>
      <button class="btn btn-secondary" id="btn-nav-creator" onclick="window.app.startNewCharacter()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10"></path><path d="M4 8h16"></path><path d="M4 8v3a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V8"></path></svg>
        Forjar Personaje
      </button>
      <button class="btn btn-secondary" id="btn-nav-dm" style="display: none;" onclick="window.app.openDMModule()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"></path></svg>
        Dungeon Master
      </button>
    </div>
  </header>

  <nav class="stepper-container" id="creator-stepper-container">
    <ul class="stepper" id="stepper"></ul>
  </nav>

  <main class="main-layout" id="main-layout">
    <section class="content-panel" id="step-content"></section>
    <aside class="summary-sidebar" id="summary-sidebar"></aside>
  </main>

  <div id="modal-container"></div>
  <div id="dialog-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/public/js/app.js"></script>
</body>
</html>
